# Render Blueprint Configuration
# Deploy this Blender Web Service to Render
# See: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: blender-service
    env: docker
    dockerfilePath: ./Dockerfile
    plan: standard  # Requires 2.5GB+ RAM for Blender
    healthCheckPath: /health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: BLENDER_THREADS
        value: "4"
      - key: MAX_UPLOAD_SIZE_MB
        value: "500"
      - key: TEMP_DIR
        value: /tmp/blender_service
      - key: GIT_LFS_SKIP_SMUDGE
        value: "1"